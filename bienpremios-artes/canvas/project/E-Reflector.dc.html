<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":5800,"height":2140}}'>
class Component extends DCLogic {
  sello(k) {
    const cx = 230, cy = 170, R = 135, hojas = [];
    for (let i = 0; i < 9; i++) {
      const deg = 118 + i * 15, t = deg * Math.PI / 180, s = 1 - i * 0.04;
      [[R + 12, -32], [R - 12, 32]].forEach(([rr, tilt]) => {
        const rot = deg + 90 + tilt, rx = 19 * s, ry = 7 * s;
        const a = rot * Math.PI / 180;
        const x = cx + rr * Math.cos(t) + Math.cos(a) * rx * 0.6;
        const y = cy + rr * Math.sin(t) + Math.sin(a) * rx * 0.6;
        [[x, rot], [2 * cx - x, 180 - rot]].forEach(([hx, hr]) => hojas.push({
          l: ((hx - rx) * k).toFixed(1), t: ((y - ry) * k).toFixed(1),
          w: (2 * rx * k).toFixed(1), h: (2 * ry * k).toFixed(1), r: hr.toFixed(1),
        }));
      });
    }
    const pt = (deg) => [cx + R * Math.cos(deg * Math.PI / 180), cy + R * Math.sin(deg * Math.PI / 180)];
    const [a0, a1] = [pt(114), pt(242)];
    const f = (v) => (v * k).toFixed(1);
    const tallos = 'M ' + f(a0[0]) + ' ' + f(a0[1]) + ' A ' + f(R) + ' ' + f(R) + ' 0 0 1 ' + f(a1[0]) + ' ' + f(a1[1]) +
      ' M ' + f(2 * cx - a0[0]) + ' ' + f(a0[1]) + ' A ' + f(R) + ' ' + f(R) + ' 0 0 0 ' + f(2 * cx - a1[0]) + ' ' + f(a1[1]);
    return { hojas, tallos, w: Math.round(460 * k), h: Math.round(300 * k) };
  }
  polvo(seed, n, oro) {
    let s = seed;
    const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const out = [];
    for (let i = 0; i < n; i++) {
      const confeti = oro && i % 3 === 0;
      const w = confeti ? 6 + r() * 8 : 2 + r() * 5;
      out.push({
        x: (60 + r() * 960).toFixed(0), y: (40 + r() * 1300).toFixed(0),
        w: w.toFixed(1), h: (confeti ? w * 0.4 : w).toFixed(1),
        radio: confeti ? '1px' : '50%', r: (r() * 180).toFixed(0),
        o: (0.25 + r() * 0.7).toFixed(2), g: (confeti ? 6 : w * 3).toFixed(0),
        c: i % 4 === 0 ? '#FFF3CF' : '#E1B452',
      });
    }
    return out;
  }
  renderVals() {
    const P = [
      { foto: '/_blob/3236147155130c786920a9ac1f01e43d', g: 0, nombre: 'Arlette ', apellido: 'Ramírez', cat: 'Blogger o Influencer con mayor impacto en el BienEstar', h: 'ARLETTERAMIREZ' },
      { foto: '/_blob/db03a0c7fdb2a02937c6ade90e11df9a', g: 1, nombre: 'Juan Luis ', apellido: 'Gallardo', cat: 'Médico Funcional / Médico Integral', h: 'JUANLUISGALLARDO' },
      { foto: '/_blob/1cceeed14459223c1ca8d1e2475d926c', g: 0, nombre: 'Wera ', apellido: 'de la Garza', cat: 'Coach de Actividad Física o Fitness', h: 'WERADELAGARZA' },
      { foto: '/_blob/a63588365724cb7f2f63de53d45dd582', g: 0, nombre: 'Mary ', apellido: 'Cardona', cat: 'Podcast enfocado al BienEstar', h: 'MARYCARDONA' },
      { foto: '/_blob/0b9acf992da011820409f565879ab595', g: 1, nombre: 'Marco Antonio ', apellido: 'Regil', cat: 'Profesional con mayor impacto en el BienEstar y la salud', h: '' },
    ];
    const ST = [['Nominada', 'Nominado'], ['Nominada\noficial', 'Nominado\noficial'], ['Semifinalista', 'Semifinalista'], ['Finalista', 'Finalista'], ['Ganadora', 'Ganador']];
    const TAM = [64, 50, 46, 66, 66];
    const F = [
      { bg: '#070707', haz: 'linear-gradient(180deg, rgba(255,241,214,0.34) 0%, rgba(255,241,214,0.06) 85%, rgba(255,241,214,0) 100%)', piso: 'radial-gradient(closest-side, rgba(255,236,200,0.30), rgba(255,236,200,0))', n: 26, titulo: '#F5F2EB' },
      { bg: '#070707', haz: 'linear-gradient(180deg, rgba(255,226,214,0.34) 0%, rgba(255,226,214,0.06) 85%, rgba(255,226,214,0) 100%)', piso: 'radial-gradient(closest-side, rgba(182,24,39,0.60), rgba(182,24,39,0))', n: 30, titulo: '#F5F2EB' },
      { bg: 'radial-gradient(120% 55% at 50% 100%, #2A0A0F 0%, #070707 70%)', haz: 'linear-gradient(180deg, rgba(255,226,206,0.32) 0%, rgba(255,226,206,0.06) 85%, rgba(255,226,206,0) 100%)', piso: 'radial-gradient(closest-side, rgba(225,180,82,0.40), rgba(225,180,82,0))', n: 36, titulo: '#F3DDA0' },
      { bg: 'radial-gradient(120% 55% at 50% 100%, #4A0B12 0%, #070707 72%)', haz: 'linear-gradient(180deg, rgba(255,210,186,0.36) 0%, rgba(255,210,186,0.07) 85%, rgba(255,210,186,0) 100%)', piso: 'radial-gradient(closest-side, rgba(200,32,47,0.70), rgba(200,32,47,0))', n: 44, titulo: '#F7DE9C' },
      { bg: 'radial-gradient(120% 55% at 50% 100%, #3A2A10 0%, #070707 75%)', haz: 'linear-gradient(180deg, rgba(255,232,170,0.44) 0%, rgba(255,232,170,0.08) 85%, rgba(255,232,170,0) 100%)', piso: 'radial-gradient(closest-side, rgba(247,222,156,0.65), rgba(247,222,156,0))', n: 84, titulo: '#F7DE9C' },
    ];
    const fases = F.map((f, i) => {
      const p = P[i], st = ST[i][p.g];
      return Object.assign({}, f, p, {
        st, tam: TAM[i], s: this.sello(1.32),
        etiqueta: st.replace('\n', ' ').toUpperCase() + ' · BAJO EL REFLECTOR',
        polvo: this.polvo(97 + i * 131, f.n, i === 4),
        link: p.h ? 'BIENPREMIOS.COM/N/' + p.h : 'BIENPREMIOS.COM · GANADORES 2026',
      });
    });
    return { fases };
  }
}
