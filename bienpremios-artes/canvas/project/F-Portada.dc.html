<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":5800,"height":2140}}'>
class Component extends DCLogic {
  sello(k, bg) {
    const cx = 230, cy = 170, R = 135, hojas = [];
    for (let i = 0; i < 9; i++) {
      const deg = 118 + i * 15, t = deg * Math.PI / 180, s = 1 - i * 0.04;
      [[R + 12, -32], [R - 12, 32]].forEach(([rr, tilt]) => {
        const rot = deg + 90 + tilt, rx = 19 * s, ry = 7 * s;
        const a = rot * Math.PI / 180;
        const x = cx + rr * Math.cos(t) + Math.cos(a) * rx * 0.6;
        const y = cy + rr * Math.sin(t) + Math.sin(a) * rx * 0.6;
        [[x, rot], [2 * cx - x, 180 - rot]].forEach(([hx, hr]) => hojas.push({
          l: ((hx - rx) * k).toFixed(1), t: ((y - ry) * k).toFixed(1),
          w: (2 * rx * k).toFixed(1), h: (2 * ry * k).toFixed(1), r: hr.toFixed(1), bg,
        }));
      });
    }
    const pt = (deg) => [cx + R * Math.cos(deg * Math.PI / 180), cy + R * Math.sin(deg * Math.PI / 180)];
    const [a0, a1] = [pt(114), pt(242)];
    const f = (v) => (v * k).toFixed(1);
    const tallos = 'M ' + f(a0[0]) + ' ' + f(a0[1]) + ' A ' + f(R) + ' ' + f(R) + ' 0 0 1 ' + f(a1[0]) + ' ' + f(a1[1]) +
      ' M ' + f(2 * cx - a0[0]) + ' ' + f(a0[1]) + ' A ' + f(R) + ' ' + f(R) + ' 0 0 0 ' + f(2 * cx - a1[0]) + ' ' + f(a1[1]);
    return { hojas, tallos, w: Math.round(460 * k), h: Math.round(300 * k) };
  }
  barras(seed) {
    let s = seed;
    const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    return Array.from({ length: 30 }, () => ({ w: (1 + Math.floor(r() * 4)).toString() }));
  }

    const oro = 'linear-gradient(115deg, #8A6224 0%, #D9A441 26%, #F7DE9C 48%, #C99A3E 68%, #8A6224 100%)';

      { foto: '/_blob/78236343fd9baca95e887ceb8f06281b', g: 0, nombre: 'Paola ', apellido: 'de la Garza', cat: 'Especialista o Coach de Salud Emocional y/o Mental', h: 'PAOLADELAGARZA' },
      { foto: '/_blob/c97ef8d90aed4f2abcb33f592b54674d', g: 0, nombre: 'Rebecca ', apellido: 'Sutton', cat: 'Coach de Actividad Física o Fitness', h: 'REBECCASUTTON' },
      { foto: '/_blob/3236147155130c786920a9ac1f01e43d', g: 0, nombre: 'Arlette ', apellido: 'Ramírez', cat: 'Blogger o Influencer con mayor impacto en el BienEstar', h: 'ARLETTERAMIREZ' },
      { foto: '/_blob/db03a0c7fdb2a02937c6ade90e11df9a', g: 1, nombre: 'Juan Luis ', apellido: 'Gallardo', cat: 'Médico Funcional / Médico Integral', h: '' },

    const PAL = [['Nominada', 'Nominado'], ['Oficial', 'Oficial'], ['Semifinalista', 'Semifinalista'], ['Finalista', 'Finalista'], ['Ganadora', 'Ganador']];
    const FRASE = [['NOMINADA · BIENPREMIOS 2026', 'NOMINADO · BIENPREMIOS 2026'], ['NOMINADA OFICIAL · BIENPREMIOS 2026', 'NOMINADO OFICIAL · BIENPREMIOS 2026'], ['SEMIFINALISTA · BIENPREMIOS 2026', 'SEMIFINALISTA · BIENPREMIOS 2026'], ['FINALISTA · BIENPREMIOS 2026', 'FINALISTA · BIENPREMIOS 2026'], ['GANADORA · BIENPREMIOS 2026', 'GANADOR · BIENPREMIOS 2026']];
    const F = [
      { mast: 250, bajada: 372, bg: '#EFE8DC', mastBg: 'linear-gradient(#1A1A1A, #1A1A1A)', ink: '#1A1A1A', accent: '#8E1420', meta: '#6F675C', logoBg: '#0A0A0A', velo: 'linear-gradient(0deg, #EFE8DC 0%, #EFE8DC 34%, rgba(239,232,220,0) 100%)', hoja: 'linear-gradient(90deg, #8A6224, #D9A441)', hoja2: '#9A6E2A' },
      { mast: 300, bajada: 412, bg: '#B61827', mastBg: 'linear-gradient(#FFF8EC, #FFF8EC)', ink: '#FFF8EC', accent: '#F3DDA0', meta: '#F3DDA0', logoBg: 'transparent', velo: 'linear-gradient(0deg, #B61827 0%, #B61827 34%, rgba(182,24,39,0) 100%)', hoja: 'linear-gradient(90deg, #E1B452, #F7DE9C)', hoja2: '#F3DDA0' },
      { mast: 162, bajada: 300, bg: '#3A0E14', mastBg: 'linear-gradient(#F3DDA0, #F3DDA0)', ink: '#F5F2EB', accent: '#E1B452', meta: '#C9A961', logoBg: 'transparent', velo: 'linear-gradient(0deg, #3A0E14 0%, #3A0E14 34%, rgba(58,14,20,0) 100%)', hoja: 'linear-gradient(90deg, #C99A3E, #F7DE9C)', hoja2: '#E1B452' },
      { mast: 262, bajada: 382, bg: '#0A0A0A', mastBg: oro, ink: '#F5F2EB', accent: '#E1B452', meta: '#9C8A63', logoBg: 'transparent', velo: 'linear-gradient(0deg, #0A0A0A 0%, #0A0A0A 34%, rgba(10,10,10,0) 100%)', hoja: 'linear-gradient(90deg, #8A6224, #F7DE9C)', hoja2: '#C9A961' },
      { mast: 250, bajada: 372, bg: 'linear-gradient(160deg, #9A6E2A 0%, #D9A441 28%, #F7DE9C 50%, #D4A94E 72%, #9A6E2A 100%)', mastBg: 'linear-gradient(#1A1A1A, #1A1A1A)', ink: '#1A1A1A', accent: '#8E1420', meta: '#4A3410', logoBg: '#0A0A0A', velo: 'linear-gradient(0deg, #B88A3A 0%, rgba(184,138,58,0.85) 30%, rgba(184,138,58,0) 100%)', hoja: 'linear-gradient(90deg, #5A1018, #8E1420)', hoja2: '#8E1420' },

    const fases = F.map((f, i) => {

      return Object.assign({}, f, p, {
        palabra: PAL[i][p.g], frase: FRASE[i][p.g],

        link: p.h ? 'BIENPREMIOS.COM/N/' + p.h : 'BIENPREMIOS.COM',
      });
    });
    return { fases };
  }
